syntax = "proto3";

package proto_plugin.fixtures;

import "google/protobuf/timestamp.proto";

import "google/protobuf/descriptor.proto";

extend google.protobuf.MessageOptions {
    string table = 50002;
}

extend google.protobuf.FieldOptions {
    bool pii = 50003;
}

message Comment {
    option (table) = "comments";

    uint64 id = 1;

    string username = 2 [(pii) = true];

    string content = 3;

    google.protobuf.Timestamp created_at = 4;

    Status status = 5;

    enum Status {
        UNKNOWN   = 0;
        PENDING   = 1;
        PUBLISHED = 2;
        MODERATED = 3;
        DELETED   = 4;
    }
}

message CommentEvent {
    uint64 comment_id = 1;

    // Describes what happened to the comment.
    oneof payload {
        string created = 2;
        string edited = 3;
        bool deleted = 4;
    }
}

message CommentDigest {
    map<string, uint64> counts_by_user = 1;

    repeated string labels = 2;

    Comment.Status status = 3;

    map<uint64, Comment> comments_by_id = 4;
}
